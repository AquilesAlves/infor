<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" aria-labelledby="illustrationTitle">
  <title id="illustrationTitle">Bancada de informática com notebook, peças e ferramentas</title>

  <!-- fundo da bancada -->
  <rect x="60" y="80" width="680" height="440" rx="8" fill="#ecebe7"/>

  <!-- notebook aberto -->
  <g transform="translate(180, 160)">
    <!-- tampa / tela -->
    <rect x="0" y="0" width="280" height="180" rx="10" fill="#1c1d21"/>
    <rect x="16" y="14" width="248" height="152" rx="4" fill="#2d62ff" opacity="0.15"/>
    <rect x="40" y="42" width="120" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="40" y="64" width="180" height="8" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="40" y="82" width="140" height="8" rx="2" fill="#ffffff" opacity="0.5"/>
    <!-- base / teclado -->
    <path d="M-10 180 L290 180 L300 260 L-20 260 Z" fill="#2d62ff" opacity="0.12"/>
    <rect x="-10" y="180" width="300" height="12" rx="3" fill="#1c1d21"/>
    <!-- teclas -->
    <rect x="20" y="210" width="240" height="6" rx="1" fill="#1c1d21" opacity="0.25"/>
    <rect x="20" y="224" width="200" height="6" rx="1" fill="#1c1d21" opacity="0.25"/>
    <rect x="20" y="238" width="160" height="6" rx="1" fill="#1c1d21" opacity="0.18"/>
  </g>

  <!-- placa de vídeo / componente -->
  <g transform="translate(520, 260)">
    <rect x="0" y="0" width="160" height="90" rx="6" fill="#1c1d21"/>
    <rect x="12" y="12" width="136" height="8" rx="2" fill="#2d62ff" opacity="0.8"/>
    <rect x="12" y="28" width="100" height="6" rx="1" fill="#5e6470" opacity="0.5"/>
    <rect x="12" y="40" width="120" height="6" rx="1" fill="#5e6470" opacity="0.5"/>
    <circle cx="130" cy="66" r="10" fill="#2d62ff" opacity="0.2"/>
    <circle cx="130" cy="66" r="5" fill="#2d62ff"/>
  </g>

  <!-- chave de fenda -->
  <g transform="translate(580, 130) rotate(45)">
    <rect x="0" y="0" width="120" height="14" rx="7" fill="#5e6470"/>
    <rect x="120" y="2" width="70" height="10" rx="2" fill="#1c1d21" opacity="0.3"/>
  </g>

  <!-- parafusos / detalhes -->
  <circle cx="130" cy="440" r="6" fill="#5e6470" opacity="0.4"/>
  <circle cx="160" cy="460" r="5" fill="#5e6470" opacity="0.3"/>
  <circle cx="640" cy="440" r="5" fill="#2d62ff" opacity="0.3"/>

  <!-- linha de conexão sutil -->
  <path d="M460 300 Q540 300 520 305" stroke="#2d62ff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
